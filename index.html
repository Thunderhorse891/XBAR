<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070A" />

    <!-- Installed-app (PWA / iOS home screen) presentation. An opaque black
         status bar (not black-translucent) keeps the app's sticky top bar
         below the notch/status area, so navigation is never obscured — the
         shell has no safe-area-inset system to rely on. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="XBAR" />

    <!--
      This document is the authenticated application shell, served only under
      /app/* (see vercel.json). It must never be indexed: every public,
      crawlable page is prerendered static HTML generated by
      scripts/build-marketing.mjs and served from the site root.
    -->
    <title>XBAR App — Sign in to your workspace</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="The XBAR workspace application. See the XBAR website for product information, pricing, and resources."
    />

    <!--
      Static social-unfurl fallback. The buyer profile route injects per-horse
      OG tags at runtime (BuyerProfile.tsx), but link scrapers (Facebook,
      iMessage, X) do not execute JavaScript, so a shared /profiles/* link —
      redirected to /app/profiles/* and served this shell — unfurls with these
      generic XBAR tags instead of an empty card. Per-horse tags cannot be
      server-rendered: profiles are dynamic, token-gated, and resolved by an
      authenticated RPC at runtime. Mirrors the marketing renderer's asset and
      origin conventions (scripts/marketing/render.mjs).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="XBAR" />
    <meta property="og:title" content="XBAR — Horse sale profile" />
    <meta
      property="og:description"
      content="A horse sale profile on XBAR. Open the link to view the sale profile, approved documents, and photos."
    />
    <meta property="og:image" content="https://xbar-horse-management-app.vercel.app/brand/og-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="XBAR — one record per horse" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="XBAR — Horse sale profile" />
    <meta
      name="twitter:description"
      content="A horse sale profile on XBAR. Open the link to view the sale profile, approved documents, and photos."
    />
    <meta name="twitter:image" content="https://xbar-horse-management-app.vercel.app/brand/og-card.jpg" />
    <meta name="twitter:image:alt" content="XBAR — one record per horse" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%brand/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="%BASE_URL%brand/xbar-favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
