name: Storage policy contract

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/checks/storage-fixture-schema.sql'
      - 'supabase/checks/workspace-keyed-storage*'
      - '.github/workflows/storage-database.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/checks/storage-fixture-schema.sql'
      - 'supabase/checks/workspace-keyed-storage*'
      - '.github/workflows/storage-database.yml'
  workflow_dispatch:

permissions:
  contents: read

# Real RLS on a disposable Postgres, from production's 2026-10-01 storage
# policies, through both phases of the workspace-keyed storage migration.
jobs:
  storage-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: xbar_storage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable-test-password
      PGDATABASE: xbar_storage_test
    steps:
      - uses: actions/checkout@v7
      - name: Production starting state
        run: psql -v ON_ERROR_STOP=1 -f supabase/checks/storage-fixture-schema.sql
      - name: Contract refuses legacy and ambiguous namespaces without changing data
        run: bash supabase/checks/workspace-keyed-storage-preflight.sh
      - name: The starting state leaks, so the checks can see a leak
        run: |
          # Must fail, and for the leak itself -- not a syntax error or a
          # missing fixture, which would also exit non-zero and prove nothing.
          if out=$(psql -v ON_ERROR_STOP=1 -f supabase/checks/workspace-keyed-storage-expand.sql 2>&1); then
            echo 'The expand-window check passed on the pre-migration policies; it is not testing anything.'
            exit 1
          fi
          echo "$out" | grep -q 'Another ranch read a photo by listing it in its own gallery' || {
            echo "$out"
            echo 'The check failed, but not on the gallery leak it exists to detect.'
            exit 1
          }
      - name: Expand, then the expand-window guarantees
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261001090000_workspace_keyed_storage_expand.sql
          psql -v ON_ERROR_STOP=1 -f supabase/checks/workspace-keyed-storage-expand.sql
      - name: Contract, then the final guarantees
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261001090100_workspace_keyed_storage_contract.sql
          psql -v ON_ERROR_STOP=1 -f supabase/checks/workspace-keyed-storage.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if (select count(*) from storage.objects where
                (bucket_id = 'horse-documents' and name = 'cccccccc-cccc-4ccc-8ccc-cccccccccccc/documents/preflight/keep.pdf') or
                (bucket_id = 'horse-media' and name = 'CCCCCCCC-CCCC-4CCC-8CCC-CCCCCCCCCCCC/horses/preflight/media-keep.jpg')) <> 2 then
              raise exception 'The contract did not preserve valid existing workspace objects';
            end if;
          end $$;
          SQL
      - name: The superseded migrations refuse to run after the contract
        run: |
          for file in supabase/migrations/20260924134000_horse_media_private_signed_urls.sql \
                      supabase/migrations/20260912060000_workspace_keyed_document_storage.sql; do
            if out=$(psql -1 -v ON_ERROR_STOP=1 -f "$file" 2>&1); then
              echo "$file re-ran after the contract and may have reopened a read branch."
              exit 1
            fi
            echo "$out" | grep -q 'Superseded by 20261001090000/20261001090100' || { echo "$out"; exit 1; }
          done
          psql -v ON_ERROR_STOP=1 -f supabase/checks/workspace-keyed-storage.sql
      - name: Re-applying either phase never reopens a branch
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261001090000_workspace_keyed_storage_expand.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261001090100_workspace_keyed_storage_contract.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261001090000_workspace_keyed_storage_expand.sql
          psql -v ON_ERROR_STOP=1 -f supabase/checks/workspace-keyed-storage.sql
